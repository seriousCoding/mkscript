name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Load release variables
        run: ./scripts/release-vars.sh --github-env >> "$GITHUB_ENV"

      - name: Validate release metadata
        run: ./scripts/validate-release-metadata.sh

      - name: Install shellcheck on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install shellcheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Run tests
        run: make test

      - name: Run shell lint
        run: make lint

      - name: Build source archive for Homebrew
        if: runner.os == 'macOS'
        run: ./scripts/build-source-archive.sh

      - name: Render local Homebrew formula
        if: runner.os == 'macOS'
        run: |
          archive_path="$PWD/dist/$MKSCRIPT_SOURCE_ARCHIVE"
          archive_sha=$(shasum -a 256 "$archive_path" | awk '{print $1}')
          mkdir -p build/homebrew
          ./scripts/render-homebrew-formula.sh "file://$archive_path" "$archive_sha" build/homebrew/mkscript.rb

      - name: Install Homebrew formula
        if: runner.os == 'macOS'
        run: ./scripts/test-homebrew-formula.sh ./build/homebrew/mkscript.rb

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Load release variables
        run: ./scripts/release-vars.sh --github-env >> "$GITHUB_ENV"

      - name: Validate release metadata
        run: ./scripts/validate-release-metadata.sh

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts dpkg-dev fakeroot lintian rpm rpmlint shellcheck

      - name: Build source archive
        run: ./scripts/build-source-archive.sh

      - name: Build Debian package
        run: ./scripts/build-deb-native.sh

      - name: Build RPM package
        run: ./scripts/build-rpm-docker.sh

      - name: Write release aliases
        run: ./scripts/write-release-aliases.sh dist

      - name: Write checksums
        run: ./scripts/write-checksums.sh dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
