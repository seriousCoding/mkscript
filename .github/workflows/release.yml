name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts dpkg-dev fakeroot lintian rpm rpmlint shellcheck

      - name: Run tests
        run: make test

      - name: Run shell lint
        run: make lint

      - name: Build source archive
        run: ./scripts/build-source-archive.sh

      - name: Render Homebrew formula
        run: |
          version=$(cat VERSION)
          archive_path="$PWD/dist/mkscript-$version.tar.gz"
          archive_sha=$(sha256sum "$archive_path" | awk '{print $1}')
          ./scripts/render-homebrew-formula.sh \
            "https://github.com/seriousCoding/mkscript/releases/download/v$version/mkscript-$version.tar.gz" \
            "$archive_sha" \
            dist/mkscript.rb

      - name: Build Debian package
        run: ./scripts/build-deb-native.sh

      - name: Build RPM package
        run: ./scripts/build-rpm-docker.sh

      - name: Write release aliases
        run: ./scripts/write-release-aliases.sh dist

      - name: Write checksums
        run: ./scripts/write-checksums.sh dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap publish."
            exit 0
          fi
          ./scripts/publish-homebrew-tap.sh dist/mkscript.rb seriousCoding/homebrew-tap
